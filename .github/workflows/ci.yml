name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  golden-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: pytest -v
      - name: Regenerate test vectors
        run: python -m model.generate_vectors --out /tmp/vectors
