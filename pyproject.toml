[project]
name = "int8-systolic-gemm-model"
version = "0.1.0"
description = "Golden model for the INT8 weight-stationary systolic GEMM accelerator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# cocotb 2.x requires Verilator >= 5.036; distro packages ship 5.020.
rtl = ["cocotb==1.9.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
